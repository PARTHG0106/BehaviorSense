# BehaviorSense AI — Unified ADL Taxonomy v1.0
#
# 20 classes chosen so that every class is (a) recognisable from 2D pose + light object
# context, and (b) meaningful to the behavioural layer. A class that no downstream
# feature consumes is dead weight and was removed.
#
# `behaviour_role` declares what each class feeds in Agent 3. This is the contract that
# stops the taxonomy drifting away from the reasoning layer.

version: "1.0"
n_classes: 20

classes:
  - id: 0
    name: walking
    group: mobility
    behaviour_role: [mobility_index, room_transition]
    notes: Primary mobility signal. Decline here is the strongest frailty proxy.
  - id: 1
    name: standing
    group: mobility
    behaviour_role: [posture_budget]
  - id: 2
    name: sitting
    group: posture
    behaviour_role: [posture_budget, sedentary_index]
  - id: 3
    name: lying_down
    group: posture
    behaviour_role: [sleep_proxy, inactivity]
    notes: Disambiguated from `fallen` by onset velocity + location, not pose alone.
  - id: 4
    name: standing_up
    group: transition
    behaviour_role: [sit_to_stand_count, mobility_index]
    notes: Sit-to-stand frequency/duration is a validated clinical frailty marker.
  - id: 5
    name: sitting_down
    group: transition
    behaviour_role: [sit_to_stand_count]
  - id: 6
    name: bending_reaching
    group: mobility
    behaviour_role: [flexibility_proxy]
  - id: 7
    name: falling
    group: critical
    behaviour_role: [emergency]
    notes: The transient event. High recall priority.
  - id: 8
    name: fallen_on_ground
    group: critical
    behaviour_role: [emergency, inactivity]
    notes: Post-fall state. Long dwell here = failure to recover = escalate.
  - id: 9
    name: eating
    group: nutrition
    behaviour_role: [meal_routine, nutrition_index]
  - id: 10
    name: drinking
    group: nutrition
    behaviour_role: [hydration_index]
  - id: 11
    name: cooking_food_prep
    group: nutrition
    behaviour_role: [meal_routine, iadl_index]
  - id: 12
    name: taking_medication
    group: health
    behaviour_role: [medication_adherence]
    notes: REQUIRES object context. Pose alone cannot separate this from `drinking`.
  - id: 13
    name: watching_tv
    group: leisure
    behaviour_role: [sedentary_index, routine_anchor]
  - id: 14
    name: reading
    group: leisure
    behaviour_role: [cognitive_engagement]
  - id: 15
    name: using_phone
    group: social
    behaviour_role: [social_index]
  - id: 16
    name: cleaning_housework
    group: iadl
    behaviour_role: [iadl_index]
    notes: IADL decline typically precedes ADL decline — early warning signal.
  - id: 17
    name: personal_hygiene
    group: selfcare
    behaviour_role: [selfcare_index]
    notes: Coarse only. Bathroom cameras are excluded on ethical grounds.
  - id: 18
    name: interacting_with_person
    group: social
    behaviour_role: [social_index, visitor_frequency]
    notes: Requires >=2 tracked persons. Social isolation is a mortality risk factor.
  - id: 19
    name: other_idle
    group: null_class
    behaviour_role: []
    notes: Explicit reject class. Without it the model force-fits ambiguous windows.

# ---------------------------------------------------------------------------
# SOURCE MAPPINGS
# Unmapped source classes -> `other_idle` or dropped. `drop: true` means excluded
# from training entirely (ambiguous or actively harmful to the label space).
# ---------------------------------------------------------------------------

